name: build
on: [workflow_dispatch]
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y make clang dpkg-dev fakeroot libplist-utils xz-utils
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 https://github.com/theos/sdks $HOME/theos/sdks
          sudo curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: BSVX-deb
          path: packages/*.deb
