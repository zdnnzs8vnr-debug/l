name: build
on: [workflow_dispatch]
jobs:
  deb:
    runs-on: ubuntu-latest
    container:
      image: theos/theos:latest
    steps:
      - uses: actions/checkout@v4
      - name: rootful
        run: make package FINALPACKAGE=1
      - name: rootless
        run: make clean && make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - uses: actions/upload-artifact@v4
        with:
          name: BSVX-deb
          path: packages/*.deb
